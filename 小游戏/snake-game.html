<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇 · 赛博朋克霓虹</title>

<!-- ===== ① 样式定义 ===== -->
<style>
  /* ---------- 主题变量 ---------- */
  :root {
    --neon-cyan:   #00f0ff; /* 电光蓝 */
    --neon-purple: #b400ff; /* 荧光紫 */
    --neon-green:  #39ff14; /* 青柠绿 */
    --neon-pink:   #ff0080; /* 玫红 */
    --bg-dark:     #0a0a1a; /* 近黑深蓝 */
    --bg-card:     #12122a; /* 卡片底色 */
    --bg-deep:     #06061a; /* 更深底 */
    --text-soft:   #c8d6ff; /* 柔和文字 */
    --text-dim:    #6a78a8; /* 暗淡文字 */
    --radius:      16px;
    --gap:         18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; min-height: 100vh;
    background: var(--bg-dark);
    color: var(--text-soft);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }

  /* ---------- 全局背景：网格扫描线 ---------- */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(180,0,255,0.12), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(0,240,255,0.10), transparent 50%),
      linear-gradient(transparent 0, transparent 2px, rgba(0,240,255,0.025) 3px);
    background-size: 100% 100%, 100% 100%, 100% 4px;
  }

  /* ---------- 主容器 ---------- */
  .game-container {
    position: relative; z-index: 1;
    max-width: 1180px; margin: 0 auto;
    padding: 24px var(--gap);
    display: flex; flex-direction: column; align-items: center; gap: var(--gap);
  }

  /* ---------- 标题：故障艺术 ---------- */
  .title-wrap { text-align: center; padding: 8px 0 4px; }
  h1 {
    font-size: clamp(28px, 5vw, 46px); font-weight: 900; letter-spacing: 6px;
    color: #fff;
    text-shadow:
      0 0 6px var(--neon-cyan),
      0 0 14px var(--neon-cyan),
      2px 0 var(--neon-pink),
      -2px 0 var(--neon-purple);
    animation: glitch 3.2s infinite steps(1, end);
    position: relative; display: inline-block;
  }
  h1::before, h1::after {
    content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%;
    opacity: 0.7; mix-blend-mode: screen;
  }
  h1::before { color: var(--neon-pink); transform: translate(-2px, 0); animation: glitch-x 2.4s infinite linear alternate; }
  h1::after  { color: var(--neon-cyan); transform: translate(2px, 0);  animation: glitch-y 3.0s infinite linear alternate; }
  .subtitle {
    margin-top: 6px; font-size: 12px; letter-spacing: 4px; color: var(--text-dim);
    animation: neon-flicker 4s infinite;
  }

  /* ---------- 卡片通用 ---------- */
  .card {
    position: relative;
    background: linear-gradient(160deg, var(--bg-card), var(--bg-deep));
    border-radius: var(--radius);
    padding: 18px;
    isolation: isolate;
  }
  /* 霓虹渐变流光边框 */
  .card::before {
    content: ""; position: absolute; inset: -2px; z-index: -1; border-radius: calc(var(--radius) + 2px);
    background: conic-gradient(from var(--angle, 0deg),
      var(--neon-cyan), var(--neon-purple), var(--neon-pink), var(--neon-green), var(--neon-cyan));
    filter: blur(0.5px);
    animation: neon-flow 6s infinite linear;
  }
  .card::after {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: var(--radius);
    background: var(--bg-card); opacity: 0.92;
  }
  @property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @keyframes neon-flow { to { --angle: 360deg; } }

  /* ---------- 布局：桌面横向 ---------- */
  .layout {
    display: grid; gap: var(--gap); width: 100%;
    grid-template-columns: minmax(0, 1fr) 280px;
    grid-template-areas: "game side";
  }
  .game-card { grid-area: game; }
  .side-col  { grid-area: side; display: flex; flex-direction: column; gap: var(--gap); }

  /* ---------- 游戏卡片 ---------- */
  .game-card { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .canvas-frame {
    position: relative; width: 100%; max-width: 560px; aspect-ratio: 1 / 1;
    border-radius: 12px; overflow: hidden;
    background: #04040f;
    box-shadow: inset 0 0 30px rgba(0,240,255,0.08), 0 0 18px rgba(180,0,255,0.25);
  }
  #game-canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

  /* 提示文本 */
  .game-tip {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: clamp(14px, 2.4vw, 20px); letter-spacing: 2px;
    color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan);
    background: rgba(6,6,26,0.55); backdrop-filter: blur(2px);
    pointer-events: none; transition: opacity 0.2s;
  }
  .game-tip.hidden { opacity: 0; }

  /* 结束面板 */
  .game-over-panel {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(6,6,26,0.82); backdrop-filter: blur(4px);
    border-radius: 12px; padding: 20px; text-align: center;
  }
  .game-over-panel.visible { display: flex; animation: glitch 0.4s steps(1, end); }
  .game-over-panel .go-title {
    font-size: 26px; font-weight: 900; letter-spacing: 4px; color: var(--neon-pink);
    text-shadow: 0 0 12px var(--neon-pink), 2px 0 var(--neon-cyan);
  }
  .game-over-panel .go-row { font-size: 15px; color: var(--text-soft); letter-spacing: 1px; }
  .game-over-panel .go-row b { color: var(--neon-green); font-size: 18px; text-shadow: 0 0 8px var(--neon-green); }
  .game-over-panel .go-record {
    font-size: 16px; font-weight: 700; color: var(--neon-cyan);
    text-shadow: 0 0 10px var(--neon-cyan); animation: neon-flicker 1.2s infinite;
  }
  .game-over-panel .go-record.hidden { display: none; }

  /* ---------- 按钮 ---------- */
  .btn {
    cursor: pointer; border: none; outline: none;
    padding: 10px 22px; border-radius: 10px;
    font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: 2px;
    color: #fff; background: linear-gradient(135deg, rgba(0,240,255,0.18), rgba(180,0,255,0.22));
    border: 1px solid rgba(0,240,255,0.5);
    box-shadow: 0 0 12px rgba(0,240,255,0.35), inset 0 0 8px rgba(180,0,255,0.2);
    transition: transform 0.12s, box-shadow 0.2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(0,240,255,0.6), inset 0 0 10px rgba(255,0,128,0.3); }
  .btn:active { transform: translateY(0); }
  .btn-pink { border-color: rgba(255,0,128,0.6); box-shadow: 0 0 12px rgba(255,0,128,0.4), inset 0 0 8px rgba(180,0,255,0.2); }
  .btn-pink:hover { box-shadow: 0 0 22px rgba(255,0,128,0.7), inset 0 0 10px rgba(0,240,255,0.3); }

  .control-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .control-row .btn { flex: 1 1 auto; min-width: 96px; }

  /* ---------- 得分卡片 ---------- */
  .score-card { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 6px; border-radius: 10px;
    background: rgba(0,0,0,0.25); border: 1px solid rgba(180,0,255,0.25);
  }
  .stat .label { font-size: 11px; letter-spacing: 2px; color: var(--text-dim); }
  .stat .value { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
  .stat .value.cyan   { color: var(--neon-cyan);   text-shadow: 0 0 8px var(--neon-cyan); }
  .stat .value.pink   { color: var(--neon-pink);   text-shadow: 0 0 8px var(--neon-pink); }
  .stat .value.green  { color: var(--neon-green);  text-shadow: 0 0 8px var(--neon-green); }
  .stat .value.purple { color: var(--neon-purple); text-shadow: 0 0 8px var(--neon-purple); }

  /* ---------- 说明卡片 ---------- */
  .help-card h2 {
    font-size: 14px; letter-spacing: 3px; color: var(--neon-green);
    text-shadow: 0 0 8px var(--neon-green); margin-bottom: 10px;
  }
  .help-card ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .help-card li { font-size: 13px; line-height: 1.6; color: var(--text-soft); display: flex; gap: 8px; align-items: baseline; }
  .help-card li::before { content: "▸"; color: var(--neon-pink); text-shadow: 0 0 6px var(--neon-pink); }
  .help-card kbd {
    display: inline-block; min-width: 22px; padding: 1px 6px; margin: 0 2px;
    border-radius: 5px; font-size: 12px; font-family: inherit; text-align: center;
    color: var(--neon-cyan); background: rgba(0,240,255,0.08);
    border: 1px solid rgba(0,240,255,0.4); box-shadow: 0 0 6px rgba(0,240,255,0.3);
  }

  /* ---------- 动效关键帧 ---------- */
  @keyframes neon-flicker {
    0%, 100% { opacity: 1; }
    41% { opacity: 1; } 42% { opacity: 0.55; } 43% { opacity: 1; }
    77% { opacity: 1; } 78% { opacity: 0.7; }  79% { opacity: 1; }
  }
  @keyframes glitch {
    0%, 92%, 100% { transform: translate(0,0); clip-path: inset(0 0 0 0); }
    93% { transform: translate(-3px, 1px); clip-path: inset(20% 0 30% 0); }
    94% { transform: translate(3px, -1px); clip-path: inset(60% 0 10% 0); }
    95% { transform: translate(-2px, 0);  clip-path: inset(40% 0 40% 0); }
    96% { transform: translate(2px, 1px);  clip-path: inset(10% 0 70% 0); }
  }
  @keyframes glitch-x { 0% { transform: translate(-2px,0); } 100% { transform: translate(2px, 1px); } }
  @keyframes glitch-y { 0% { transform: translate(2px,0); }  100% { transform: translate(-2px,-1px); } }

  /* ---------- 响应式：平板 ---------- */
  @media (max-width: 1023px) and (min-width: 768px) {
    .layout { grid-template-columns: minmax(0, 1fr) 240px; }
    .canvas-frame { max-width: 480px; }
  }

  /* ---------- 响应式：移动 ---------- */
  @media (max-width: 767px) {
    .game-container { padding: 16px 12px; gap: 14px; }
    .layout { grid-template-columns: 1fr; grid-template-areas: "game" "side"; }
    .canvas-frame { max-width: 100%; }
    .side-col { flex-direction: column; }
    h1 { letter-spacing: 4px; }
    .stat .value { font-size: 20px; }
  }

  /* ---------- 响应式：极小屏兜底 ---------- */
  @media (max-width: 320px) {
    .game-container { padding: 10px 6px; gap: 10px; }
    .card { padding: 12px; }
    .btn { padding: 8px 14px; font-size: 12px; min-width: 80px; }
    .stat .value { font-size: 18px; }
  }

  /* ---------- 弱设备降级 ---------- */
  .low-fx h1 { animation: none; }
  .low-fx h1::before, .low-fx h1::after { display: none; }
  .low-fx .card::before { animation: none; }
  .low-fx .subtitle { animation: none; }
</style>
</head>

<body>
<main class="game-container">
  <div class="title-wrap">
    <h1 data-text="贪吃蛇">贪吃蛇</h1>
    <div class="subtitle">SNAKE · NEON · CYBERPUNK</div>
  </div>

  <div class="layout">
    <!-- 游戏卡片 -->
    <section class="card game-card">
      <div class="canvas-frame">
        <canvas id="game-canvas" width="400" height="400"></canvas>
        <div class="game-tip" id="game-tip">点击开始或按空格键开始游戏</div>
        <div class="game-over-panel" id="game-over-panel">
          <div class="go-title" id="go-title">游戏结束</div>
          <div class="go-row">本局得分 <b id="go-score">0</b></div>
          <div class="go-row">历史最高 <b id="go-high">0</b></div>
          <div class="go-record hidden" id="go-record">★ 新纪录 ★</div>
          <button class="btn btn-pink" id="btn-replay">再来一局</button>
        </div>
      </div>
      <div class="control-row">
        <button class="btn" id="btn-start">开始</button>
        <button class="btn" id="btn-pause">暂停</button>
        <button class="btn btn-pink" id="btn-restart">重新开始</button>
      </div>
    </section>

    <!-- 右侧栏 -->
    <div class="side-col">
      <section class="card score-card">
        <div class="stat"><span class="label">得分</span><span class="value green" id="stat-score">0</span></div>
        <div class="stat"><span class="label">最高分</span><span class="value pink" id="stat-high">0</span></div>
        <div class="stat"><span class="label">速度等级</span><span class="value cyan" id="stat-speed">1</span></div>
        <div class="stat"><span class="label">当前长度</span><span class="value purple" id="stat-length">3</span></div>
      </section>

      <section class="card help-card">
        <h2>操作说明</h2>
        <ul>
          <li>方向键 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 控制方向</li>
          <li>WASD 键 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 同样可用</li>
          <li>空格键 <kbd>Space</kbd> 开始 / 暂停 / 继续</li>
          <li>移动端在游戏区滑动控制方向</li>
          <li>吃到食物得分 +10，每 50 分提速一级</li>
        </ul>
      </section>
    </div>
  </div>
</main>

<!-- ===== ② 游戏配置 ===== -->
<script>
// ---------- CONFIG 常量集中定义 ----------
const CONFIG = {
  ROWS: 20,
  COLS: 20,
  BASE_SCORE: 10,
  SPEED_THRESHOLD: 50,
  MAX_SPEED_LEVEL: 10,
  MIN_FRAME_INTERVAL: 60,
  INITIAL_FRAME_INTERVAL: 250,
  FRAME_DECREMENT: 19,
  INITIAL_SNAKE_LENGTH: 3,
  PARTICLE_COUNT: 14,
  PARTICLE_COUNT_LOW: 6,
  PARTICLE_MAX: 200,
  PARTICLE_LIFE: 400,       // 毫秒
  TOUCH_THRESHOLD: 10,
  STORAGE_KEY: 'snake-game-high-score',
  NEON_COLORS: {
    cyan:   '#00f0ff',
    purple: '#b400ff',
    green:  '#39ff14',
    pink:   '#ff0080',
  },
};

// ---------- 方向查表 ----------
const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
const DELTA = {
  up:    { row: -1, col: 0 },
  down:  { row: 1,  col: 0 },
  left:  { row: 0,  col: -1 },
  right: { row: 0,  col: 1 },
};

// ---------- 全局游戏状态 ----------
let gameState = {
  state: 'idle',            // idle | running | paused | over
  snake: [],                // SnakeNode[]，索引 0 为蛇头
  direction: 'right',
  pendingDirection: null,
  food: { row: 0, col: 0 },
  score: 0,
  highScore: 0,
  speedLevel: 1,
  particles: [],
  lastLogicTime: 0,
  pausedAt: 0,
  storageAvailable: true,
  snakeSet: new Set(),      // O(1) 查重，编码 row*COLS+col
  lowFx: false,             // 弱设备降级标记
  rafId: null,
  lastFrameTime: 0,
  dropFrameCount: 0,
};

// DOM 引用缓存
const dom = {};
</script>

<!-- ===== ③ 核心逻辑 ===== -->
<script>
// ---------- 本地存储适配：读取最高分 ----------
function loadHighScore() {
  try {
    const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
    if (raw === null) return 0;
    const val = Number.parseInt(raw, 10);
    if (Number.isNaN(val) || val < 0) return 0;
    return val;
  } catch (e) {
    gameState.storageAvailable = false;
    return 0;
  }
}

// ---------- 本地存储适配：写入最高分 ----------
function saveHighScore(score) {
  try {
    localStorage.setItem(CONFIG.STORAGE_KEY, String(score));
    return true;
  } catch (e) {
    gameState.storageAvailable = false;
    return false;
  }
}

// ---------- 状态机：流转单入口 ----------
function transitionTo(newState) {
  const cur = gameState.state;
  const legal =
    (cur === 'idle' && newState === 'running') ||
    (cur === 'running' && newState === 'paused') ||
    (cur === 'paused' && newState === 'running') ||
    (cur === 'running' && newState === 'over') ||
    (cur === 'over' && newState === 'running') ||
    (newState === 'running'); // restart 任意态 → running
  if (!legal) {
    console.warn('[状态机] 非法跳转被忽略：', cur, '→', newState);
    return false;
  }
  gameState.state = newState;
  updateTipText();
  updateControlButtons();
  return true;
}

// ---------- 提示文本同步 ----------
function updateTipText() {
  const tip = dom.tip;
  if (!tip) return;
  switch (gameState.state) {
    case 'idle':
      tip.textContent = '点击开始或按空格键开始游戏';
      tip.classList.remove('hidden');
      break;
    case 'paused':
      tip.textContent = '游戏暂停，按空格键继续';
      tip.classList.remove('hidden');
      break;
    case 'running':
      tip.classList.add('hidden');
      break;
    case 'over':
      tip.classList.add('hidden');
      break;
  }
}

// ---------- 控制按钮显隐同步 ----------
function updateControlButtons() {
  const s = gameState.state;
  dom.btnStart.style.display = (s === 'idle') ? 'inline-block' : 'none';
  dom.btnPause.style.display = (s === 'running' || s === 'paused') ? 'inline-block' : 'none';
  dom.btnPause.textContent = (s === 'paused') ? '继续' : '暂停';
}

// ---------- 食物随机生成 ----------
function spawnFood() {
  const total = CONFIG.ROWS * CONFIG.COLS;
  const free = total - gameState.snake.length;
  if (free <= 0) return null;
  const randomIndex = Math.floor(Math.random() * free);
  let count = 0;
  for (let r = 0; r < CONFIG.ROWS; r++) {
    for (let c = 0; c < CONFIG.COLS; c++) {
      if (!gameState.snakeSet.has(r * CONFIG.COLS + c)) {
        if (count === randomIndex) {
          gameState.food = { row: r, col: c };
          return gameState.food;
        }
        count++;
      }
    }
  }
  return null;
}

// ---------- 重置蛇身与对局状态 ----------
function resetMatchState() {
  const midRow = Math.floor(CONFIG.ROWS / 2);
  const midCol = Math.floor(CONFIG.COLS / 2);
  gameState.snake = [];
  gameState.snakeSet = new Set();
  for (let i = CONFIG.INITIAL_SNAKE_LENGTH - 1; i >= 0; i--) {
    const node = { row: midRow, col: midCol - i };
    gameState.snake.push(node);
    gameState.snakeSet.add(node.row * CONFIG.COLS + node.col);
  }
  gameState.direction = 'right';
  gameState.pendingDirection = null;
  gameState.score = 0;
  gameState.speedLevel = 1;
  gameState.particles = [];
  gameState.lastLogicTime = 0;
  gameState.pausedAt = 0;
  spawnFood();
}

// ---------- 初始化 ----------
function initGame() {
  cacheDom();
  gameState.highScore = loadHighScore();
  resetMatchState();
  gameState.state = 'idle';
  hideGameOverPanel();
  updateTipText();
  updateHUD();
  updateControlButtons();
  resizeCanvas();
  bindEvents();
  gameState.lastFrameTime = performance.now();
  gameState.rafId = requestAnimationFrame(gameLoop);
  // 自动开始游戏，玩家打开即可看到蛇身移动
  startGame();
}

// ---------- 开始游戏 ----------
function startGame() {
  if (gameState.state !== 'idle') return;
  transitionTo('running');
  gameState.lastLogicTime = performance.now();
}

// ---------- 暂停 / 继续 ----------
function togglePause() {
  if (gameState.state === 'running') {
    transitionTo('paused');
    gameState.pausedAt = performance.now();
  } else if (gameState.state === 'paused') {
    const pausedDuration = performance.now() - gameState.pausedAt;
    gameState.lastLogicTime += pausedDuration;
    transitionTo('running');
  }
}

// ---------- 重新开始 ----------
function restartGame() {
  if (gameState.rafId) cancelAnimationFrame(gameState.rafId);
  resetMatchState();
  hideGameOverPanel();
  transitionTo('running');
  gameState.lastLogicTime = performance.now();
  gameState.lastFrameTime = performance.now();
  gameState.rafId = requestAnimationFrame(gameLoop);
}

// ---------- 设置方向（含反向过滤） ----------
function setDirection(dir) {
  if (gameState.state !== 'running') return;
  if (dir === OPPOSITE[gameState.direction]) return;
  if (dir === gameState.direction) return;
  gameState.pendingDirection = dir;
}

// ---------- 单次逻辑帧移动 ----------
function stepSnake() {
  if (gameState.pendingDirection) {
    gameState.direction = gameState.pendingDirection;
    gameState.pendingDirection = null;
  }
  const head = gameState.snake[0];
  const d = DELTA[gameState.direction];
  const newHead = { row: head.row + d.row, col: head.col + d.col };

  // 撞墙判定
  if (newHead.row < 0 || newHead.row >= CONFIG.ROWS ||
      newHead.col < 0 || newHead.col >= CONFIG.COLS) {
    endGame('撞墙了！游戏结束');
    return;
  }
  // 咬自身判定
  if (gameState.snakeSet.has(newHead.row * CONFIG.COLS + newHead.col)) {
    endGame('咬到自己了！游戏结束');
    return;
  }

  // 进食判定
  const ate = (newHead.row === gameState.food.row && newHead.col === gameState.food.col);

  gameState.snake.unshift(newHead);
  gameState.snakeSet.add(newHead.row * CONFIG.COLS + newHead.col);

  if (ate) {
    gameState.score += CONFIG.BASE_SCORE;
    spawnParticles(gameState.food.row, gameState.food.col);
    const newFood = spawnFood();
    if (newFood === null) {
      endGame('恭喜通关！游戏结束');
      return;
    }
    updateSpeedLevel();
  } else {
    const tail = gameState.snake.pop();
    gameState.snakeSet.delete(tail.row * CONFIG.COLS + tail.col);
  }
  updateHUD();
}

// ---------- 速度等级联动 ----------
function updateSpeedLevel() {
  const newLevel = Math.min(
    CONFIG.MAX_SPEED_LEVEL,
    1 + Math.floor(gameState.score / CONFIG.SPEED_THRESHOLD)
  );
  if (newLevel !== gameState.speedLevel) {
    gameState.speedLevel = newLevel;
  }
}

// ---------- 帧间隔映射 ----------
function getFrameInterval() {
  return Math.max(
    CONFIG.MIN_FRAME_INTERVAL,
    CONFIG.INITIAL_FRAME_INTERVAL - (gameState.speedLevel - 1) * CONFIG.FRAME_DECREMENT
  );
}

// ---------- 游戏结束 ----------
function endGame(reason) {
  if (!transitionTo('over')) return;
  let brokeRecord = false;
  if (gameState.score > gameState.highScore) {
    gameState.highScore = gameState.score;
    brokeRecord = true;
    const ok = saveHighScore(gameState.score);
    if (!ok) {
      showTransientTip('最高分未能保存到本地');
    }
  }
  showGameOverPanel(brokeRecord, reason);
  updateHUD();
}

// ---------- 瞬时提示（存储失败等） ----------
let transientTimer = null;
function showTransientTip(text) {
  dom.tip.textContent = text;
  dom.tip.classList.remove('hidden');
  if (transientTimer) clearTimeout(transientTimer);
  transientTimer = setTimeout(() => updateTipText(), 2200);
}
</script>

<!-- ===== ④ 渲染层 ===== -->
<script>
// ---------- 缓存 DOM ----------
function cacheDom() {
  dom.canvas    = document.getElementById('game-canvas');
  dom.ctx       = dom.canvas.getContext('2d');
  dom.tip       = document.getElementById('game-tip');
  dom.overPanel = document.getElementById('game-over-panel');
  dom.goTitle   = document.getElementById('go-title');
  dom.goScore   = document.getElementById('go-score');
  dom.goHigh    = document.getElementById('go-high');
  dom.goRecord  = document.getElementById('go-record');
  dom.btnStart  = document.getElementById('btn-start');
  dom.btnPause  = document.getElementById('btn-pause');
  dom.btnRestart= document.getElementById('btn-restart');
  dom.btnReplay = document.getElementById('btn-replay');
  dom.statScore = document.getElementById('stat-score');
  dom.statHigh  = document.getElementById('stat-high');
  dom.statSpeed = document.getElementById('stat-speed');
  dom.statLen   = document.getElementById('stat-length');
}

// ---------- 画布尺寸响应式 ----------
function resizeCanvas() {
  const frame = dom.canvas.parentElement;
  let size = Math.floor(Math.min(frame.clientWidth, frame.clientHeight));
  if (!size || size < 100) size = Math.floor(frame.clientWidth) || 400;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  dom.canvas.width = size * dpr;
  dom.canvas.height = size * dpr;
  dom.canvas.style.width = size + 'px';
  dom.canvas.style.height = size + 'px';
  dom.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dom._cssSize = size;
}

// ---------- 主渲染 ----------
function renderFrame() {
  const ctx = dom.ctx;
  const size = dom._cssSize || dom.canvas.width;
  const cellW = size / CONFIG.COLS;
  const cellH = size / CONFIG.ROWS;

  // 清空
  ctx.clearRect(0, 0, size, size);

  // 背景渐变
  const bg = ctx.createLinearGradient(0, 0, size, size);
  bg.addColorStop(0, '#06061a');
  bg.addColorStop(1, '#0a0a22');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, size, size);

  // 网格线
  ctx.strokeStyle = 'rgba(0,240,255,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < CONFIG.COLS; i++) {
    ctx.moveTo(i * cellW, 0); ctx.lineTo(i * cellW, size);
  }
  for (let i = 1; i < CONFIG.ROWS; i++) {
    ctx.moveTo(0, i * cellH); ctx.lineTo(size, i * cellH);
  }
  ctx.stroke();

  // 食物（玫红/荧光紫发光）
  drawFood(ctx, cellW, cellH);

  // 蛇身（青柠绿/电光蓝渐变发光）
  drawSnake(ctx, cellW, cellH);

  // 粒子
  drawParticles(ctx);
}

// ---------- 绘制食物 ----------
function drawFood(ctx, cellW, cellH) {
  const f = gameState.food;
  const cx = f.col * cellW + cellW / 2;
  const cy = f.row * cellH + cellH / 2;
  const r = Math.max(2, Math.min(cellW, cellH) * 0.32);
  ctx.save();
  ctx.shadowBlur = 12;
  ctx.shadowColor = CONFIG.NEON_COLORS.pink;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.4, CONFIG.NEON_COLORS.pink);
  grad.addColorStop(1, CONFIG.NEON_COLORS.purple);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ---------- 绘制蛇身 ----------
function drawSnake(ctx, cellW, cellH) {
  const snake = gameState.snake;
  const len = snake.length;
  for (let i = len - 1; i >= 0; i--) {
    const node = snake[i];
    const x = node.col * cellW;
    const y = node.row * cellH;
    const isHead = (i === 0);
    const t = len > 1 ? i / (len - 1) : 0; // 0 头 → 1 尾
    ctx.save();
    ctx.shadowBlur = isHead ? 14 : 9;
    ctx.shadowColor = isHead ? CONFIG.NEON_COLORS.cyan : CONFIG.NEON_COLORS.green;
    // 青柠绿(头) → 电光蓝(尾) 渐变
    const r = Math.round(57  + (0   - 57)  * t);
    const g = Math.round(255 + (240 - 255) * t);
    const b = Math.round(20  + (255 - 20)  * t);
    ctx.fillStyle = isHead ? '#ffffff' : `rgb(${r},${g},${b})`;
    const pad = isHead ? 1 : 2;
    const radius = Math.max(2, Math.min(cellW, cellH) * 0.22);
    roundRect(ctx, x + pad, y + pad, cellW - pad * 2, cellH - pad * 2, radius);
    ctx.fill();
    // 蛇头眼睛
    if (isHead) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0a0a1a';
      const ex = x + cellW / 2, ey = y + cellH / 2;
      const d = DELTA[gameState.direction];
      const off = Math.min(cellW, cellH) * 0.18;
      const eyeR = Math.max(1, Math.min(cellW, cellH) * 0.08);
      ctx.beginPath();
      ctx.arc(ex + d.col * off - d.row * off * 0.6, ey + d.row * off - d.col * off * 0.6, eyeR, 0, Math.PI * 2);
      ctx.arc(ex + d.col * off + d.row * off * 0.6, ey + d.row * off + d.col * off * 0.6, eyeR, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ---------- 圆角矩形辅助 ----------
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- DOM HUD 更新 ----------
function updateHUD() {
  dom.statScore.textContent = gameState.score;
  dom.statHigh.textContent  = gameState.highScore;
  dom.statSpeed.textContent = gameState.speedLevel;
  dom.statLen.textContent   = gameState.snake.length;
}

// ---------- 结束面板 ----------
function showGameOverPanel(brokeRecord, reason) {
  dom.goTitle.textContent = reason || '游戏结束';
  dom.goScore.textContent = gameState.score;
  dom.goHigh.textContent  = gameState.highScore;
  if (brokeRecord) {
    dom.goRecord.classList.remove('hidden');
  } else {
    dom.goRecord.classList.add('hidden');
  }
  dom.overPanel.classList.add('visible');
}
function hideGameOverPanel() {
  dom.overPanel.classList.remove('visible');
}

// ---------- 粒子系统：生成 ----------
function spawnParticles(row, col) {
  if (gameState.particles.length > CONFIG.PARTICLE_MAX) return;
  const size = dom._cssSize || dom.canvas.width;
  const cellW = size / CONFIG.COLS;
  const cellH = size / CONFIG.ROWS;
  const cx = col * cellW + cellW / 2;
  const cy = row * cellH + cellH / 2;
  const count = gameState.lowFx ? CONFIG.PARTICLE_COUNT_LOW : CONFIG.PARTICLE_COUNT;
  const colors = [CONFIG.NEON_COLORS.pink, CONFIG.NEON_COLORS.purple, CONFIG.NEON_COLORS.cyan, CONFIG.NEON_COLORS.green];
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = 0.04 + Math.random() * 0.10;
    const maxLife = CONFIG.PARTICLE_LIFE * (0.7 + Math.random() * 0.6);
    gameState.particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed * size,
      vy: Math.sin(angle) * speed * size,
      life: maxLife,
      maxLife: maxLife,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 2 + Math.random() * 2.5,
    });
  }
}

// ---------- 粒子系统：更新与绘制 ----------
function updateAndDrawParticles(dt) {
  if (gameState.particles.length === 0) return;
  const ctx = dom.ctx;
  ctx.save();
  for (const p of gameState.particles) {
    p.x += p.vx * dt / 1000;
    p.y += p.vy * dt / 1000;
    p.life -= dt;
  }
  gameState.particles = gameState.particles.filter(p => p.life > 0);
  for (const p of gameState.particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.shadowBlur = 8;
    ctx.shadowColor = p.color;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ---------- 弱设备降级检测 ----------
function detectLowFx(dt) {
  if (gameState.lowFx) return;
  if (dt > 20) {
    gameState.dropFrameCount++;
    if (gameState.dropFrameCount >= 3) {
      gameState.lowFx = true;
      document.body.classList.add('low-fx');
    }
  } else {
    gameState.dropFrameCount = 0;
  }
}
</script>

<!-- ===== ⑤ 事件绑定 ===== -->
<script>
// ---------- 游戏循环 ----------
function gameLoop(timestamp) {
  const dt = timestamp - gameState.lastFrameTime;
  gameState.lastFrameTime = timestamp;
  detectLowFx(dt);

  // 自适应：容器布局生效后尺寸可能变化，检测并重置画布
  const frame = dom.canvas.parentElement;
  const actualSize = Math.floor(Math.min(frame.clientWidth, frame.clientHeight));
  if (actualSize && actualSize !== dom._cssSize) resizeCanvas();

  renderFrame();
  updateAndDrawParticles(dt);

  if (gameState.state === 'running') {
    if (timestamp - gameState.lastLogicTime >= getFrameInterval()) {
      stepSnake();
      gameState.lastLogicTime = timestamp;
    }
  }
  gameState.rafId = requestAnimationFrame(gameLoop);
}

// ---------- 键盘事件 ----------
function handleKeyDown(e) {
  const key = e.key;
  switch (key) {
    case 'ArrowUp': case 'w': case 'W':
      e.preventDefault();
      if (gameState.state === 'idle') startGame();
      setDirection('up'); break;
    case 'ArrowDown': case 's': case 'S':
      e.preventDefault();
      if (gameState.state === 'idle') startGame();
      setDirection('down'); break;
    case 'ArrowLeft': case 'a': case 'A':
      e.preventDefault();
      if (gameState.state === 'idle') startGame();
      setDirection('left'); break;
    case 'ArrowRight': case 'd': case 'D':
      e.preventDefault();
      if (gameState.state === 'idle') startGame();
      setDirection('right'); break;
    case ' ':
    case 'Spacebar':
      e.preventDefault();
      if (gameState.state === 'idle') startGame();
      else if (gameState.state === 'running') togglePause();
      else if (gameState.state === 'paused') togglePause();
      // over 态空格不响应
      break;
    default: break;
  }
}

// ---------- 触屏滑动 ----------
let touchStartX = 0, touchStartY = 0;
function handleTouchStart(e) {
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
}
function handleTouchEnd(e) {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if (Math.abs(dx) < CONFIG.TOUCH_THRESHOLD && Math.abs(dy) < CONFIG.TOUCH_THRESHOLD) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    setDirection(dx > 0 ? 'right' : 'left');
  } else {
    setDirection(dy > 0 ? 'down' : 'up');
  }
}
function handleTouchMove(e) {
  // 阻止移动端页面滚动
  if (e.cancelable) e.preventDefault();
}

// ---------- 窗口 resize ----------
let resizeTimer = null;
function handleResize() {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeCanvas, 120);
}

// ---------- 绑定所有事件 ----------
function bindEvents() {
  window.addEventListener('keydown', handleKeyDown);
  window.addEventListener('resize', handleResize);

  const canvas = dom.canvas;
  canvas.addEventListener('touchstart', handleTouchStart, { passive: true });
  canvas.addEventListener('touchend', handleTouchEnd, { passive: true });
  canvas.addEventListener('touchmove', handleTouchMove, { passive: false });

  dom.btnStart.addEventListener('click', startGame);
  dom.btnPause.addEventListener('click', togglePause);
  dom.btnRestart.addEventListener('click', restartGame);
  dom.btnReplay.addEventListener('click', restartGame);
}

// ---------- 启动 ----------
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initGame);
} else {
  initGame();
}
</script>
</body>
